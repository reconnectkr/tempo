name: Tempo
options:
  bundleIdPrefix: com.daegun
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

targets:
  Tempo:
    type: application
    platform: macOS
    sources:
      - Tempo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daegun.tempo
        PRODUCT_NAME: Tempo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: Tempo/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tempo/Tempo.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_LSUIElement: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
